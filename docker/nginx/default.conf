# Mỗi app một cổng, mỗi cổng chuyển vào php-fpm của app đó. Các dịch vụ gọi nhau qua nginx (alias mạng trong docker-compose.yml).
upstream gateway_fpm   { server gateway-app:9000; }
upstream warranty_fpm  { server warranty-app:9000; }
upstream repair_fpm    { server repair-app:9000; }
upstream inventory_fpm { server inventory-app:9000; }

server {
    listen 8000;
    root /srv/gateway/public;
    set $fpm_upstream gateway_fpm;
    include /etc/nginx/snippet.conf;
}

server {
    listen 8001;
    root /srv/warranty-service/public;
    set $fpm_upstream warranty_fpm;
    include /etc/nginx/snippet.conf;
}

server {
    listen 8002;
    root /srv/repair-service/public;
    set $fpm_upstream repair_fpm;
    include /etc/nginx/snippet.conf;
}

server {
    listen 8003;
    root /srv/inventory-service/public;
    set $fpm_upstream inventory_fpm;
    include /etc/nginx/snippet.conf;
}
