# Dùng chung cho mọi server block: file tĩnh lấy từ public, còn lại đẩy vào index.php của app tương ứng
location / {
    try_files $uri /index.php?$query_string;
}

location = /index.php {
    include fastcgi_params;
    # Trong container php-fpm, mã nguồn của app luôn nằm ở /app
    fastcgi_param SCRIPT_FILENAME /app/public/index.php;
    fastcgi_pass $fpm_upstream;
    # Inventory mô phỏng chậm tới 10 giây, giữ timeout rộng hơn client của Gateway (30 giây)
    fastcgi_read_timeout 60s;
}

location ~ /\. {
    deny all;
}
